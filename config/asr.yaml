/**:
  ros__parameters:
    log:
      log_level: info
      log_path: ./log
      async: false

    # 识别后端：
    # sense_voice = silero VAD + SenseVoice 离线识别，输出完整文本；
    # keyword     = sherpa-onnx 流式 KWS，只输出命中的关键词。
    backend: sense_voice

    # audio_io 的节点名与 capture/event 话题由 audio_io_interface 的
    # kDefaultNodeFqn/topic_capture/topic_event 统一生成，并自动加上
    # asr 当前 namespace；这里不需要配置节点名或采集话题。
    capture:
      # 只接受该 AudioStream.stream_id；空字符串表示接受任意流。
      stream_id: mic

    # 播放门控：audio_io 正在播放时暂停识别，避免把自己的声音当成输入。
    gate:
      # false 时不订阅/不处理播放事件，识别不会被播放打断。
      enabled: true
      # 播放结束后的额外静音保持，避免尾音触发。
      holdoff_ms: 300
      # 门控兜底：超过该时长强制恢复识别，防止事件丢失导致永久静音。
      max_ms: 15000

    # 可选唤醒词阶段：启用后主 backend 只在唤醒窗口内运行。
    # 唤醒 KWS 复用下面的 keyword.* 模型配置。
    wake:
      # true = 常开 KWS 检测唤醒词；false = 所有音频直接送主 backend。
      enabled: false
      # 唤醒词表（text2token 生成的 keywords.txt）；@ 后为显示词。
      # 由 duck_asr 等上层提供，asr 不硬编码具体召唤词。
      keywords_file: /opt/sherpa-onnx/models/kws/wake_keywords.txt
      # 唤醒前保留的音频长度，防止“唤醒词 + 命令”连读时命令开头被切掉。
      pre_roll_ms: 1000
      # 唤醒后等待命令的最长时间；超时发 EVENT_CANCELED 并回到 Idle。
      followup_timeout_ms: 6000

    # 采集回调与推理工作线程之间的有界队列。
    queue:
      # 队列按音频时长限制；溢出时丢弃最旧数据。
      max_ms: 2000

    # AsrState 状态话题发布周期。
    state:
      period_ms: 500

    # silero VAD，从 sherpa-onnx 模型页下载 silero_vad.onnx。
    # 仅 backend=sense_voice 时使用。
    vad:
      # silero_vad.onnx 路径。
      model: /opt/sherpa-onnx/models/silero_vad.onnx
      # 语音概率阈值，越高越保守。
      threshold: 0.25
      # 判定句尾所需的最短静音时长（秒）。
      min_silence_duration: 0.5
      # 最短有效语音时长（秒），过短的片段会被丢弃。
      min_speech_duration: 0.25
      # 单个语音段的最长时长（秒），超过会强制切分。
      max_speech_duration: 10.0
      # VAD 输入窗口样本数，通常为 512。
      window_size: 512
      # VAD 内部缓冲时长（秒）。
      buffer_seconds: 30.0
      # VAD 推理线程数。
      num_threads: 1
      # 执行提供者，通常为 cpu。
      provider: cpu
      # sherpa-onnx 调试输出。
      debug: false

    # SenseVoice 离线识别模型；仅 backend=sense_voice 时使用。
    recognizer:
      # SenseVoice ONNX 模型路径。
      model: /opt/sherpa-onnx/models/sense-voice/model.int8.onnx
      # 模型对应的 tokens.txt。
      tokens: /opt/sherpa-onnx/models/sense-voice/tokens.txt
      # 语言提示：auto / zh / en / ja / ko / yue。
      language: auto
      # 是否启用逆文本归一化（数字、标点等）。
      use_itn: true
      # ONNX Runtime 推理线程数。
      num_threads: 1
      # 执行提供者，通常为 cpu。
      provider: cpu
      # sherpa-onnx 调试输出。
      debug: false

    # sherpa-onnx KWS 模型：
    # - backend=keyword 时用于命令词；
    # - wake.enabled=true 时也用于唤醒词检测。
    keyword:
      # 流式 transducer encoder；int8 版本体积更小。
      encoder: /opt/sherpa-onnx/models/kws/encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx
      # 流式 transducer decoder。
      decoder: /opt/sherpa-onnx/models/kws/decoder-epoch-13-avg-2-chunk-16-left-64.onnx
      # 流式 transducer joiner；int8 版本体积更小。
      joiner: /opt/sherpa-onnx/models/kws/joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx
      # KWS 模型 tokens.txt。
      tokens: /opt/sherpa-onnx/models/kws/tokens.txt
      # keyword 后端的命令词表；wake 使用独立的 wake.keywords_file。
      keywords_file: /opt/sherpa-onnx/models/kws/keywords.txt
      # KWS 搜索活动路径数，越大越准但越耗 CPU。
      max_active_paths: 4
      # 触发前需要看到的尾随 blank 数，影响触发延迟。
      num_trailing_blanks: 1
      # 关键词加分，越大越容易被命中。
      keywords_score: 1.0
      # 检测阈值，越大越保守。
      keywords_threshold: 0.25
      # ONNX Runtime 推理线程数。
      num_threads: 1
      # 执行提供者，通常为 cpu。
      provider: cpu
      # sherpa-onnx 调试输出。
      debug: false

    # AsrEvent/AsrState header.frame_id。
    frame_id: mic
